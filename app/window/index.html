<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Strict: only this folder's own files; no inline script, no network. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Menu bar chat</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <main class="chat" aria-label="Chat">
      <!-- One line: where you are (project and its tag) on the left, today's spend on the right. -->
      <header class="bar">
        <button type="button" id="project" class="bar-btn project-btn" aria-expanded="false" aria-controls="panel-projects"
          title="Switch project, pick up a past chat, work or personal">Project</button>
        <span id="tag" class="tag">work</span>
        <span class="spacer"></span>
        <button type="button" id="checkup" class="bar-btn bar-quiet" aria-expanded="false" aria-controls="panel-checkup"
          title="Check that the app can work: API key, helper, GitHub, spend and this project">Checkup</button>
        <button type="button" id="spend" class="bar-btn meter num" aria-expanded="false" aria-controls="panel-usage"
          aria-live="polite">$0.00 of $5 today</button>
      </header>

      <!-- The conversation, or a panel laid over it. Only this part scrolls. -->
      <div class="stage">
        <section id="log" class="log" tabindex="0" aria-live="polite" aria-label="Conversation"></section>
        <section id="panel-projects" class="panel" aria-label="Projects and chats" hidden></section>
        <section id="panel-usage" class="panel" aria-label="Usage" hidden></section>
        <section id="panel-checkup" class="panel" aria-label="Checkup" hidden></section>
      </div>

      <!-- What waits on you sits right above the chat box, one card at a time. -->
      <section id="cards" class="cards" aria-label="Waiting on you"></section>

      <div id="notice" class="notice" role="status" hidden></div>

      <form id="composer" class="composer" autocomplete="off">
        <label class="sr-only" for="input">Message</label>
        <textarea id="input" rows="2" placeholder="Ask Claude to do something in this project…" aria-describedby="keys"></textarea>
        <p id="keys" class="sr-only">Enter sends. Shift-Enter starts a new line. Esc tucks the window away.</p>
        <div class="composer-row">
          <span class="select-wrap">
            <select id="mode" class="bar-btn mode-select" aria-label="Mode" title="Every change asks you first">
              <option value="default">Ask me first</option>
              <option value="plan">Plan first</option>
              <option value="dev">Dev mode</option>
            </select>
          </span>
          <span id="status" class="status" aria-live="polite"></span>
          <button type="button" id="stop" class="btn btn-quiet" disabled>Stop</button>
          <button type="submit" id="send" class="btn btn-primary">Send</button>
        </div>
      </form>
    </main>

  </div>
  <script src="dom.js" defer></script>
  <script src="scroll.js" defer></script>
  <script src="markdown.js" defer></script>
  <script src="log.js" defer></script>
  <script src="cards.js" defer></script>
  <script src="github-row.js" defer></script>
  <script src="usage-panel.js" defer></script>
  <script src="checkup-panel.js" defer></script>
  <script src="panel.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
